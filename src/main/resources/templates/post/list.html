<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>게시판</title>
</head>
<body>
    <div layout:fragment="content">
        <section class="max-w-7xl mx-auto px-4 py-12">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-bold">게시판</h2>
                <a th:if="${session.user}" th:href="@{/posts/new}" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm font-medium">글쓰기</a>
            </div>

            <!-- 검색 기능 -->
            <div class="mb-8 bg-white rounded-lg shadow-md p-6">
                <form th:action="@{/posts}" method="get" class="flex flex-col md:flex-row gap-4">
                    <div class="flex-1">
                        <label for="keyword" class="block text-sm font-medium text-gray-700 mb-2">검색어</label>
                        <input type="text" 
                               id="keyword" 
                               name="keyword" 
                               th:value="${keyword}"
                               placeholder="검색어를 입력하세요"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
                    </div>
                    <div class="md:w-48">
                        <label for="searchType" class="block text-sm font-medium text-gray-700 mb-2">검색 범위</label>
                        <select id="searchType" 
                                name="searchType" 
                                th:value="${searchType}"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            <option value="all">전체</option>
                            <option value="title">제목</option>
                            <option value="content">내용</option>
                            <option value="author">작성자</option>
                        </select>
                    </div>
                    <div class="flex gap-2 items-end">
                        <button type="submit" 
                                class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">
                            🔍 검색
                        </button>
                        <a th:href="@{/posts}" 
                           class="px-6 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 font-medium">
                            초기화
                        </a>
                    </div>
                </form>
                
                <!-- 검색 결과 표시 -->
                <div th:if="${keyword != null and !keyword.isEmpty()}" class="mt-4 p-3 bg-blue-50 rounded-lg">
                    <p class="text-blue-800">
                        <span class="font-semibold">"[[${keyword}]]"</span> 검색 결과: 
                        <span class="font-bold">[[${posts.size()}]]</span>개의 게시글
                        <span th:if="${searchType != 'all'}">(검색 범위: [[${searchType == 'title' ? '제목' : searchType == 'content' ? '내용' : '작성자'}]])</span>
                    </p>
                </div>
            </div>

            <div class="overflow-x-auto bg-white shadow rounded-lg">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">번호</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">제목</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">작성자</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">작성일</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">조회수</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <!-- 게시글이 있을 때 -->
                        <tr th:each="post, status : ${posts}" th:if="${posts != null and !posts.empty}">
                            <td th:text="${status.count}" class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">1</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm">
                                <div class="flex items-center space-x-3">
                                    <div class="flex-1">
                                        <a th:href="@{/posts/{id}(id=${post.id})}" 
                                           th:text="${post.title}" 
                                           class="text-blue-600 hover:underline font-medium">
                                            게시글 제목
                                        </a>
                                        <div th:if="${post.imagePath != null}" class="flex items-center mt-1 space-x-2">
                                            <span class="text-green-600 text-xs">📷</span>
                                            <span class="text-xs text-gray-500">이미지 첨부</span>
                                        </div>
                                    </div>
                                    <!-- 이미지 미리보기 -->
                                    <div th:if="${post.imagePath != null}" class="w-16 h-16 flex-shrink-0">
                                        <img th:src="@{'/' + ${post.imagePath}}" 
                                             alt="이미지 미리보기" 
                                             class="w-full h-full object-cover rounded border" />
                                    </div>
                                </div>
                            </td>
                            <td th:text="${post.author.nickname}" class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">작성자</td>
                            <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}" class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">2025-01-01</td>
                            <td th:text="${post.viewCount}" class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">0</td>
                        </tr>
                        
                        <!-- 게시글이 없을 때 -->
                        <tr th:if="${posts == null or posts.empty}">
                            <td colspan="5" class="px-6 py-8 text-center text-gray-500">
                                등록된 게시글이 없습니다.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

</body>
</html>
